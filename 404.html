<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found • Kenneth Charles</title>
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400&amp;display=swap"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://kenchrls.vercel.app/assets/favicon-32.png"
    />
    <!-- Served at any missing path, so every URL here is absolute and the styles are inline. -->
    <style>
      html {
        background: #000000;
        color: #ececee;
        font-family: Geist, system-ui, sans-serif;
        cursor:
          url("https://kenchrls.vercel.app/assets/icons/cursor-on-dark.svg") 4 3,
          auto;
      }
      body {
        margin: 0;
      }
      .frame {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: calc(100svh - 24px);
        margin: 12px;
        background: #0f0f11;
        border-radius: 28px;
      }
      .notch {
        display: grid;
        place-items: center;
        width: 96px;
        height: 52px;
        margin: 0 auto;
        background: #000000;
        border-radius: 0 0 22px 22px;
      }
      .notch-ck {
        width: 40px;
        height: 40px;
        padding: 0;
        background: url("https://kenchrls.vercel.app/assets/mascot/mini-ck-directions.webp") 50% 50% / 300% 300% no-repeat;
        image-rendering: pixelated;
        filter: grayscale(1);
      }
      main {
        place-self: center;
        padding: 16px;
      }
      p {
        margin: 0;
      }
      .code {
        color: #8b8b91;
        font: 12px "Geist Mono", ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 24px;
        font-size: clamp(40px, 9vw, 88px);
        font-weight: 500;
        line-height: 0.88;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      a {
        display: inline-block;
        padding: 10px 0;
        color: inherit;
        cursor: inherit;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <nav class="notch" aria-label="Site">
        <a class="notch-ck" href="https://kenchrls.vercel.app/" aria-label="Home"></a>
      </nav>
      <main>
        <p class="code">404</p>
        <h1>This page doesn't exist.</h1>
        <a href="https://kenchrls.vercel.app/">← Home</a>
      </main>
    </div>
  </body>
</html>
