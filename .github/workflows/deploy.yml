name: Check & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (node:test, zero dependencies)
        run: node --test tests/*.test.js

      - name: Syntax-check JavaScript
        run: node --check script.js && node --check assets/data.js

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html

      - name: Check links and asset paths
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress index.html
          fail: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage runtime files only
        run: |
          mkdir _site
          cp -r index.html 404.html style.css script.js assets _site/

      - name: Cache-bust CSS/JS with the commit SHA
        run: bash .github/scripts/cache-bust.sh _site "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
