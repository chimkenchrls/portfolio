# Cloudflare Worker for the portfolio API (chat + shared poke counter).
# Deploy steps are in docs/assistant.md. Nothing here is secret: the Gemini key is
# stored with `npx wrangler secret put GEMINI_API_KEY`, never in this file; the same
# goes for RESEND_API_KEY (the contact form).
name = "kenchrls-api"
main = "worker/index.mjs"
compatibility_date = "2026-01-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Exact site origins allowed to call the API, separated by commas (no trailing slash).
ALLOWED_ORIGINS = "https://kenchrls.vercel.app,https://chimkenchrls.github.io"
# Gemini requests allowed per day across all visitors.
DAILY_CHAT_LIMIT = "100"
# Contact form: where messages are emailed, and who they appear to come from.
# With Resend's test sender (onboarding@resend.dev) CONTACT_TO must be the email
# address of your Resend account; verify a domain in Resend to change either.
CONTACT_TO = "kennethcharles291@gmail.com"
CONTACT_FROM = "Portfolio <onboarding@resend.dev>"
# Emails allowed per day (Resend's free plan allows 100).
CONTACT_DAILY_LIMIT = "50"
GUESTBOOK_DAILY_LIMIT = "50"

[[d1_databases]]
binding = "DB"
database_name = "portfolio"
# Paste the id printed by `npx wrangler d1 create portfolio`.
database_id = "b486a580-2b84-421c-9980-38deb926e31b"
